name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # AgentScope 2.x itself requires Python >= 3.11.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[agentscope,dev]"
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -p no:cacheprovider
      - name: Wire capture (protocol evidence)
        run: python e2e/wire_capture.py
