[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentscope-agent-hints"
version = "0.1.0"
description = "Agent Hint protocol (X-Agent-Hint) plugin for AgentScope 2.x"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "tree-zby" }]
keywords = ["agentscope", "agent-hint", "kv-cache", "llm", "inference"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
agentscope = ["agentscope>=2.0,<3"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/tree-zby/agentscope-agent-hints"
Protocol = "https://github.com/evan7ang/dsh-agent-hints"

[tool.hatch.build.targets.wheel]
packages = ["src/agentscope_agent_hints"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
